<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ROBLOX Scripts Hub</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #1a1a1a;
            min-height: 100vh;
            color: #e0e0e0;
            line-height: 1.6;
        }

        .container {
            max-width: 960px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
            padding: 20px 0;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 8px;
            color: #ffffff;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .header h1 svg {
            width: 32px;
            height: 32px;
            margin-right: 12px;
        }

        .header p {
            font-size: 1.1rem;
            color: #888;
            font-weight: 400;
        }
        
        .sponsored-by {
            font-size: 0.9rem;
            color: #777;
            margin-top: 10px;
        }

        /* Registration Modal */
        .modal {
            display: flex;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.9);
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background: #2d2d2d;
            padding: 40px;
            border-radius: 8px;
            text-align: center;
            max-width: 480px;
            width: 90%;
            border: 1px solid #404040;
        }

        .modal h2 {
            color: #ffffff;
            margin-bottom: 16px;
            font-size: 1.8rem;
            font-weight: 600;
        }

        .modal p {
            color: #aaa;
            margin-bottom: 24px;
            font-size: 1rem;
        }

        .modal input {
            width: 100%;
            padding: 12px 16px;
            font-size: 1rem;
            border: 1px solid #404040;
            border-radius: 4px;
            margin: 12px 0;
            background-color: #1a1a1a;
            color: #e0e0e0;
            transition: border-color 0.2s ease;
        }

        .modal input:focus {
            outline: none;
            border-color: #007aff;
        }

        .modal input::placeholder {
            color: #666;
        }

        .modal button {
            background-color: #007aff;
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 4px;
            font-size: 1rem;
            cursor: pointer;
            transition: background-color 0.2s ease;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        
        .modal button svg {
            width: 16px;
            height: 16px;
            margin-left: 8px;
        }

        .modal button:hover {
            background-color: #005ec4;
        }

        .modal .note {
            font-size: 0.85rem;
            color: #666;
            margin-top: 16px;
            line-height: 1.4;
        }

        /* Scripts Grid */
        .scripts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 0px;
        }

        .script-panel {
            background: #2d2d2d;
            border-radius: 6px;
            padding: 5px;
            border: 1px solid #404040;
            transition: border-color 0.2s ease, transform 0.2s ease;
            flex-direction: column;
            justify-content: space-between;
        }

        .script-panel:hover {
            border-color: #555;
            transform: translateY(-3px);
        }

        .script-name {
            font-size: 1.2rem;
            font-weight: 600;
            color: #ffffff;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
        }

        .script-name svg {
            width: 20px;
            height: 20px;
            margin-right: 10px;
            fill: #e0e0e0;
        }
        
        .script-code {
           display: none;
        }

        .copy-btn {
            background-color: #007aff;
            color: white;
            padding: 10px 16px;
            border: none;
            border-radius: 4px;
            font-size: 0.95rem;
            cursor: pointer;
            transition: background-color 0.2s ease;
            width: 100%;
            font-weight: 500;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .copy-btn svg {
            width: 16px;
            height: 16px;
            margin-right: 8px;
        }

        .copy-btn:hover {
            background-color: #005ec4;
        }

        .copy-btn.copied {
            background-color: #28a745;
        }

        .user-info {
            background: #2d2d2d;
            border: 1px solid #404040;
            padding: 1px;
            border-radius: 0px;
            text-align: center;
            margin-bottom: 1px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .user-info svg {
            width: 20px;
            height: 20px;
            margin-right: 10px;
            fill: #e0e0e0;
        }

        .user-info strong {
            font-size: 1.1rem;
            color: #ffffff;
            font-weight: 600;
        }

        .hidden {
            display: none;
        }

        @media (max-width: 4px) {
            .scripts-grid {
                grid-template-columns: 1fr;
            }
            
            .header h1 {
                font-size: 2rem;
            }
            
            .modal-content {
                margin: 10px;
                padding: 10px;
            }

            .container {
                padding: 15px;
            }
        }

        @media (max-width: 480px) {
            .header h1 {
                font-size: 1.8rem;
            }
            
            .modal-content {
                padding: 24px;
            }
        }
    </style>
</head>
<body>
    <div id="registrationModal" class="modal">
        <div class="modal-content">
            <h2>
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8z"/><path d="M12 6c-3.31 0-6 2.69-6 6s2.69 6 6 6 6-2.69 6-6-2.69-6-6-6zm0 10c-2.21 0-4-1.79-4-4s1.79-4 4-4 4 1.79 4 4-1.79 4-4 4z"/></svg>
                RootScripts
            </h2>
            <p>Enter your ROBLOX username to continue.</p>
            <input type="text" id="usernameInput" placeholder="Mat3L0rd_exiled" maxlength="20">
            <div class="note">Your username will be automatically inserted when you copy scripts.</div>
            <button onclick="registerUser()">
                Continue
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M8.59 16.59L13.17 12 8.59 7.41 10 6l6 6-6 6-1.41-1.41z"/></svg>
            </button>
        </div>
    </div>

    <div id="mainContent" class="hidden">
        <div class="container">
            <div class="header">
                <h1>
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8z"/><path d="M12 6c-3.31 0-6 2.69-6 6s2.69 6 6 6 6-2.69 6-6-2.69-6-6-6zm0 10c-2.21 0-4-1.79-4-4s1.79-4 4-4 4 1.79 4 4-1.79 4-4 4z"/></svg>
                    Rootscripts
                </h1>
                <p>Script collections by rootless & other users</p>
                <p class="sponsored-by">Sponsored by Nyxara SS. THERE'S NO DESTROY SCRIPTS! SAFE TO USE WITH ANY SS</p>
            </div>

            <div id="userInfo" class="user-info">
                <strong>
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
                    User: <span id="currentUser"></span>
                </strong>
            </div>

            <div class="scripts-grid" id="scriptsContainer">
              
            </div>
        </div>
    </div>

    <script>
        let currentUsername = '';
        
        const scripts = [
            { name: "HD Admin Ranker", code: 'require(11560761226).HD("urnamehere")' },
            { name: "Hammer", code: 'require(8038037940).CLoad("urnamehere")' },
            { name: "Kuma ( Q, E )", code: 'require(6099324864).load("urnamehere")' },
            { name: "Bad Karma", code: 'require(4471066396).load("urnamehere")' },
            { name: "Void Boss ( Z, X, C, V )", code: 'require(6175490752).load("urnamehere")' },
            { name: "Xester V2 ( E, R, T, G, Z, M, Y, F, Q, R, Y, G )", code: 'require(6099241563).load("urnamehere")' },
            { name: "Veltex ( Q, E, T, F, J )", code: 'require(6099316092).load("urnamehere")' },
            { name: "Shadow Kars", code: 'require(6058159336).load("urnamehere")' },
            { name: "The Defiant", code: 'require(6168743245).load("urnamehere")' },
            { name: "The Disturbed ( Q, E, Y, F )", code: 'require(6099363076).load("urnamehere")' },
            { name: "Jester ( T, Z, X, V )", code: 'require(6042859321).load("urnamehere")' },
            { name: "Dimensions", code: 'require(6058166669).load("urnamehere")' },
            { name: "Server Admin", code: 'require(4665394711).load("urnamehere")' },
            { name: "Nectula ( T, G, Z, X, V )", code: 'require(3224070983).load("urnamehere")' },
            { name: "Desolate ( R, F, M )", code: 'require(6088494183).load("urnamehere")' },
            { name: "Brick Hamman", code: 'require(6015747481).load("urnamehere")' },
            { name: "Vaxtemi Boss Battle", code: 'require(5619264516).dark("urnamehere")' },
            { name: "Death Sheriff", code: 'require(6056559552).load("urnamehere")' },
            { name: "Holy Hand Grenade", code: 'require(6027832941).load("urnamehere")' },
            { name: "Stick Beater ( Z, X, C )", code: 'require(5813743814).load("urnamehere")' },
            { name: "Project Light", code: 'require(5977500481).load("urnamehere")' },
            { name: "Oculus ( Z, X, C, V, M )", code: 'require(5813695241).load("urnamehere")' },
            { name: "Cyber Knight", code: 'require(5617200606).cyber("urnamehere")' },
            { name: "Lost Soul ( Q, J, H, G, F, Z, X, C, V, SHIFT )", code: 'require(5390158029).dark("urnamehere")' },
            { name: "Achromatic ( M, C, V, Z, NUMBERS )", code: 'require(5857033951).load("urnamehere")' },
            { name: "Archangel of Light ( Z, X, C )", code: 'require(5813836873).load("urnamehere")' },
            { name: "Aureola ( NUMBERS, Z )", code: 'require(5813799887).load("urnamehere")' },
            { name: "Aether Lightning ( CTRL, Q, E, R )", code: 'require(4229413153).load("urnamehere")' },
            { name: "Nightmare ( Q, Z, M )", code: 'require(4943481014).Nightmare("urnamehere")' },
            { name: "Glorious Bastion of Light", code: 'require(5375460203).Player("urnamehere")' },
            { name: "Sociopath", code: 'require(4611999946).load("urnamehere")' },
            { name: "Fallen Anger", code: 'require(4490557105).load("urnamehere")' },
            { name: "Military Tank", code: 'require(5068511197).insert("urnamehere")' },
            { name: "Chronos Sentinel", code: 'require(4661847142).load("urnamehere")' },
            { name: "Felipe's Ascension", code: 'require(5605396200):load("urnamehere","Felipe")' },
            { name: "Echo", code: 'require(5374597845).Dark("urnamehere")' },
            { name: "Darkomos", code: 'require(5346891374).Dark("urnamehere")' },
            { name: "Stan ( E, Q )", code: 'require(5270525643).Dark("urnamehere")' },
            { name: "Dominus Venari ( Q, T, Z, X, C, V, B, K)", code: 'require(3256686965).load("urnamehere")' },
            { name: "Grab Gun ( C, M, G, O, F, V, N, X )", code: 'require(5146659840).Dark_Eccentric("Dark_Eccentric", "urnamehere")' }
        ];

        function registerUser() {
            const username = document.getElementById('usernameInput').value.trim();
            if (username === '') {
                alert('Please enter your ROBLOX username.');
                return;
            }
            
            currentUsername = username;
            document.getElementById('currentUser').textContent = username;
            document.getElementById('registrationModal').classList.add('hidden');
            document.getElementById('mainContent').classList.remove('hidden');
            
            generateScripts();
        }

        function generateScripts() {
            const container = document.getElementById('scriptsContainer');
            container.innerHTML = '';
            
            scripts.forEach((script, index) => {
                const scriptPanel = document.createElement('div');
                scriptPanel.className = 'script-panel';
                
                const personalizedCode = script.code.replace(/urnamehere/g, currentUsername);
                
                scriptPanel.innerHTML = `
                    <div class="script-name">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M9.4 16.6L4.8 12l4.6-4.6L8 6l-6 6 6 6 1.4-1.4zm5.2 0l4.6-4.6-4.6-4.6L16 6l6 6-6 6-1.4-1.4z"/></svg>
                        ${script.name}
                    </div>
                    <div class="script-code" id="code-${index}">${personalizedCode}</div>
                    <button class="copy-btn" onclick="copyScript(${index})">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg>
                        Copy
                    </button>
                `;
                
                container.appendChild(scriptPanel);
            });
        }

        async function copyScript(index) {
            const codeElement = document.getElementById(`code-${index}`);
            const button = codeElement.nextElementSibling;
            const code = codeElement.textContent;
            
            try {
                await navigator.clipboard.writeText(code);
                button.innerHTML = `
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41L9 16.17z"/></svg>
                    Copied!
                `;
                button.classList.add('copied');
                
                setTimeout(() => {
                    button.innerHTML = `
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg>
                        Copy
                    `;
                    button.classList.remove('copied');
                }, 2000);
            } catch (err) {
                console.error('Failed to copy: ', err);
            }
        }


        document.getElementById('usernameInput').addEventListener('keypress', function(event) {
            if (event.key === 'Enter') {
                registerUser();
            }
        });

        window.addEventListener('load', function() {
            document.getElementById('usernameInput').focus();
        });
    </script>
</body>
</html>
